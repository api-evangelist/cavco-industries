description: >-
  Cavco Industries, Inc. (Nasdaq: CVCO), founded in Phoenix, Arizona in 1965, designs and builds factory-built housing
  — manufactured homes, modular homes, park model RVs and vacation cabins — at more than twenty plants across the
  United States, sold through independent and company-owned retailers under the Cavco family of brands (including
  Fleetwood Homes and Palm Harbor Homes), with financing through its CountryPlace Mortgage subsidiary and homeowner
  insurance through Standard Casualty. It is a Fortune 1000 home builder, not a software vendor: it publishes no
  developer program, API reference, OpenAPI, SDK or webhook surface. Its only integration property is a login-gated
  Angular retailer portal (CavConnect, cavconnect.cavco.com) whose backend host is not publicly resolvable. The
  developer.cavco.com and api.cavco.com hosts an earlier profile scaffolded do not exist in DNS and were removed
  from this record.
