    note: >-
      The California privacy notice enumerates CCPA rights — right to know / access, data portability
      (a "readily useable" format), deletion, and opt-out of sale (honored for twelve months before
      re-asking) — and states Cavco "endeavor[s] to respond to a verifiable consumer request within
      forty-five (45) days of its receipt", with a possible further 45-day extension; up to two
      access/portability requests per 12-month period. Requests go to Privacy@Cavco.com or the
      "Do Not Sell My Personal Information" OneTrust webform (privacyportal.onetrust.com). The general
      privacy policy (https://www.cavcohomes.com/privacy-policy) separately offers access, update and
      deletion by email to privacy@cavco.com. No web API endpoint is published.
